name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun run wasm
      - run: bun run check
      - run: bun run --cwd site build
      - run: bun run --cwd frontend build
      - name: Bundle sizes
        run: |
          echo '| JS file | bytes | gzip |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          for f in frontend/dist/assets/*.js frontend/dist/*.js; do
            echo "| ${f#frontend/dist/} | $(wc -c < "$f") | $(gzip -c "$f" | wc -c) |" >> "$GITHUB_STEP_SUMMARY"
          done
