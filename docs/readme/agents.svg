<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 246" width="480" height="246" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif">
<title>Agents with triggers on a schedule</title>
<rect width="480" height="246" rx="14" fill="#07070A"/>
<text x="24" y="36" fill="#EAEAF0" font-size="14" font-weight="600" text-anchor="start">Agents</text><rect x="14" y="52" width="452" height="54" rx="8" fill="#0E0E12"/><circle cx="34" cy="79" r="3.5" fill="#59D38C"/><text x="50" y="75" fill="#EAEAF0" font-size="13" font-weight="600" text-anchor="start">Morning digest</text><text x="50" y="93" fill="#AAAAB0" font-size="12" font-weight="400" text-anchor="start">Every weekday at 07:30</text><text x="450" y="83" fill="#85858B" font-size="12" font-weight="400" text-anchor="end">Next run in 3 h</text><rect x="14" y="114" width="452" height="54" rx="8" fill="#0E0E12"/><circle cx="34" cy="141" r="3.5" fill="#85858B"/><text x="50" y="137" fill="#EAEAF0" font-size="13" font-weight="600" text-anchor="start">Invoice sorter</text><text x="50" y="155" fill="#AAAAB0" font-size="12" font-weight="400" text-anchor="start">When mail arrives from Outlook</text><text x="450" y="145" fill="#85858B" font-size="12" font-weight="400" text-anchor="end">Idle</text><rect x="14" y="176" width="452" height="54" rx="8" fill="#0E0E12"/><circle cx="34" cy="203" r="3.5" fill="#59D38C"/><text x="50" y="199" fill="#EAEAF0" font-size="13" font-weight="600" text-anchor="start">Meeting prep</text><text x="50" y="217" fill="#AAAAB0" font-size="12" font-weight="400" text-anchor="start">1 h before each calendar event</text><text x="450" y="207" fill="#85858B" font-size="12" font-weight="400" text-anchor="end">Next run in 40 min</text>
</svg>
