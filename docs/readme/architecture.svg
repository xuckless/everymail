<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 194" width="480" height="194" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif">
<title>Frontend, Rust engine and Backend connected by protobuf</title>
<rect width="480" height="194" rx="14" fill="#07070A"/>
<rect x="14" y="22" width="112" height="124" rx="8" fill="#0E0E12"/><text x="70.0" y="50" fill="#EAEAF0" font-size="14" font-weight="600" text-anchor="middle">Frontend</text><text x="70.0" y="82" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">React</text><text x="70.0" y="102" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">renders and</text><text x="70.0" y="122" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">takes input</text><rect x="184" y="22" width="112" height="124" rx="8" fill="#0E0E12"/><text x="240.0" y="50" fill="#EAEAF0" font-size="14" font-weight="600" text-anchor="middle">Rust engine</text><text x="240.0" y="82" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">owns all state</text><text x="240.0" y="102" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">local SQLite</text><text x="240.0" y="122" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">desktop and web</text><rect x="354" y="22" width="112" height="124" rx="8" fill="#0E0E12"/><text x="410.0" y="50" fill="#EAEAF0" font-size="14" font-weight="600" text-anchor="middle">Backend</text><text x="410.0" y="82" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">Bun, TS</text><text x="410.0" y="102" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">Postgres</text><text x="410.0" y="122" fill="#AAAAB0" font-size="11.5" font-weight="400" text-anchor="middle">and pgvector</text><path d="M136 96H174M136 96l5 -4M136 96l5 4M174 96l-5 -4M174 96l-5 4" stroke="#9C85FC" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="155" y="84" fill="#85858B" font-size="10" font-weight="400" text-anchor="middle">protobuf</text><path d="M306 96H344M306 96l5 -4M306 96l5 4M344 96l-5 -4M344 96l-5 4" stroke="#9C85FC" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="325" y="84" fill="#85858B" font-size="10" font-weight="400" text-anchor="middle">protobuf</text><text x="240" y="174" fill="#85858B" font-size="11.5" font-weight="400" text-anchor="middle">Tauri on desktop, WASM in a Worker on web</text>
</svg>
