[package]
name = "everymail-engine"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.14"
reqwest = { version = "0.13", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[build-dependencies]
prost-build = { version = "0.14", default-features = false }
protox = "0.10"

# wasm-pack's wasm-opt validates against the MVP; enable the features rustc emits for wasm32 by default.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
