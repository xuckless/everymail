syntax = "proto3";

package ui.v1;

import "ui/v1/common.proto";

// A new agent being written, with a dry run beside it. Back and Cancel are Intent.back.
message AgentBuilderView {
  string name = 1;
  string instructions = 2;
  // Ideas to start from.
  repeated string ideas = 3;
  // Every reactive trigger, each chosen or not.
  repeated BuilderTrigger triggers = 4;
  BuilderSchedule schedule = 5;
  // Accounts it can see.
  repeated BuilderAccount accounts = 6;
  repeated Permission permissions = 7;
  // Always ask before writing to someone new.
  bool ask_before_new_recipient = 8;
  // The model the dry run uses.
  Model test_model = 9;
  oneof dry_run {
    DryRunIdle idle = 10;
    DryRunReading reading = 11;
    DryRunResults results = 12;
    DryRunFailed failed = 17;
  }
  // The agent in short, as in the phone's last step: "Wakes", "Asks first".
  repeated SummaryLine summary = 13;
  // The steps a narrow layout walks one at a time, in order and ending in the summary, one of them
  // current (Intent.select_builder_step). A wide layout shows everything and ignores which is current.
  repeated BuilderStepTab steps = 14;
  // Create is Intent.create_agent.
  oneof creation {
    BuilderReady ready = 15;
    BuilderIncomplete incomplete = 16;
  }
  // Changes when the engine replaced the name or the instructions (an idea picked, the builder
  // started over or created): the Frontend drops what was typed in them.
  uint32 revision = 18;
  // The narrow layout's Back: the step before the current one, or none on the first step, where
  // Back leaves the builder (Intent.back).
  oneof back {
    BuilderStep back_step = 19;
    BuilderFirstStep first = 20;
  }
  // Continue: the step after the current one, or none on the summary, where Create is shown.
  oneof forward {
    BuilderStep next_step = 21;
    BuilderLastStep last = 22;
  }
  // How far along the steps the current one is, from 25 to 100.
  uint32 progress_percent = 23;
}

message BuilderFirstStep {}

message BuilderLastStep {}

message BuilderReady {}

message BuilderIncomplete {
  // "Name it", "Pick the agent “Another agent finished” waits for"
  string text = 1;
}

// The phone design's steps. The phone shows neither the accounts nor the new-recipient switch,
// and the name only as the summary's title; the desktop shows them all.
enum BuilderStep {
  BUILDER_STEP_UNSPECIFIED = 0;
  // Instructions and the ideas to start from.
  BUILDER_STEP_INSTRUCTIONS = 1;
  // Triggers and the schedule.
  BUILDER_STEP_TRIGGERS = 2;
  // Permissions.
  BUILDER_STEP_PERMISSIONS = 3;
  // The name as the title, then the summary lines.
  BUILDER_STEP_SUMMARY = 4;
}

message BuilderStepTab {
  BuilderStep step = 1;
  // "What should it do"
  string label = 2;
  bool current = 3;
}

message BuilderTrigger {
  string id = 1;
  // "Mail sorted into a category or folder"
  string label = 2;
  bool chosen = 3;
  // Checked in code before the model runs: "Sender" "Anyone".
  repeated TriggerFilter filters = 4;
  // The filters in one line: "Into For you, from anyone, Personal and Laurentian"
  string filter_summary = 5;
  oneof readiness {
    TriggerReady ready = 6;
    // Chosen, with a required filter not picked.
    TriggerIncomplete incomplete = 7;
  }
}

message TriggerReady {}

message TriggerIncomplete {
  // "Pick the agent it waits for"
  string text = 1;
}

message TriggerFilter {
  reserved 1, 2, 3;
  reserved "key", "value", "options";
  // The filter's stable id, which Intent.set_trigger_filter takes: "sender", "agent".
  string id = 4;
  // "Sender"
  string label = 5;
  // What Intent.set_trigger_filter takes, by id; the picked one is selected.
  repeated FilterChoice choices = 6;
  oneof pick {
    FilterPicked picked = 7;
    // A required filter (the agent, the file) nobody picked yet; no choice is selected.
    FilterNotPicked not_picked = 8;
  }
}

message FilterChoice {
  // "known", "account-2", "folder-3"
  string id = 1;
  // "Known contacts"
  string label = 2;
  bool selected = 3;
}

message FilterPicked {
  // The picked choice's label: "Anyone"
  string label = 1;
}

message FilterNotPicked {
  // "Pick an agent"
  string placeholder = 1;
}

message BuilderSchedule {
  // Every choice, "No schedule" (id "none") first; Intent.set_builder_schedule takes the id.
  repeated ScheduleChoice choices = 1;
  oneof state {
    Unscheduled none = 2;
    Scheduled scheduled = 3;
  }
  reserved 4;
  reserved "interval_seconds";
  // The custom schedule's interval in minutes, as its field shows it: "15". Intent.set_builder_interval
  // takes the field's text.
  string interval_minutes = 6;
  // "At least every 15 minutes"
  string interval_hint = 5;
}

message ScheduleChoice {
  // "none", "hourly", "weekdays-9", "custom"
  string id = 3;
  string label = 1;
  bool selected = 2;
}

message Unscheduled {}

message Scheduled {
  // "Every hour"
  string label = 1;
}

message BuilderAccount {
  string id = 1;
  string name = 2;
  MailProvider provider = 3;
  string provider_name = 4;
  bool can_see = 5;
}

message DryRunIdle {
  // "A dry run on your last 30 messages. Nothing is sent, moved or changed"
  string text = 1;
}

// Intent.cancel_dry_run stops it.
message DryRunReading {
  // "Reading 30 messages across 2 accounts"
  string progress = 1;
}

// Intent.start_dry_run tries again.
message DryRunFailed {
  // "The dry run did not finish in time"
  string reason = 1;
}

message DryRunResults {
  // One per message it would touch.
  repeated DryRunResult results = 1;
}

message DryRunResult {
  string from = 1;
  string action = 2;
  oneof decision {
    DecisionAsk ask = 3;
    DecisionAuto auto = 4;
    DecisionSkip skip = 5;
  }
}

message DecisionAsk {}

message DecisionAuto {}

// Not something the agent would touch.
message DecisionSkip {}

message SummaryLine {
  string label = 1;
  string value = 2;
}
