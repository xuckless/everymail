syntax = "proto3";

package ui.v1;

import "ui/v1/approvals.proto";
import "ui/v1/briefing.proto";
import "ui/v1/common.proto";
import "ui/v1/thread.proto";

// The agents screen: the phone's list of agents, or one agent's page.
//
// Desktop: the sidebar is the list (Navigation.system_agents and user_agents, Intent.select_agent),
// so the screen shows an agent's page; the list arrives only for the path "/u/0/agents".
// Phone: the Agents tab (Intent.open_agents) shows the list, with the approvals entry on top
// (Intent.open_approvals). Tapping an agent (Intent.select_agent) opens its page full screen;
// back (Intent.back) returns to the list.
message AgentsView {
  reserved 1, 2, 3, 4, 5, 6, 7;
  oneof page {
    AgentList list = 8;
    AgentPage agent = 9;
  }
}

message AgentList {
  repeated AgentRow system_agents = 1;
  repeated AgentRow user_agents = 2;
  // The phone's way to the approval queue (Intent.open_approvals).
  NavApprovals approvals = 3;
}

message AgentRow {
  reserved 6;
  string id = 1;
  string name = 2;
  AgentStatus status = 3;
  // When it runs next: "On every new mail", "Weekdays 9:00 · 1 waiting"
  string next = 4;
  // The last run: "9:45 · Sorted 6 · flagged 1"
  string last_run = 5;
}

// One agent: the header, its panes in order, and the current pane's content. The path is
// "/u/0/agents/<agent id>" on the agent's default pane and "/u/0/agents/<agent id>/<pane>" on
// another, the pane being "results", "activity", "chat" or "settings".
message AgentPage {
  string id = 1;
  string name = 2;
  // "On every new mail · Claude Sonnet", "Answers when you ask · Claude Sonnet"
  string subtitle = 3;
  // Also the settings pane's active switch (Intent.set_agent_active): on unless deactivated.
  AgentStatus status = 4;
  // Run now is shown. Assistant wakes only on a message and has none.
  bool can_run_now = 5;
  // Results, Activity, Chat (Assistant and the agents the user made), Settings; one current
  // (Intent.select_agent_detail_pane). Every agent opens on Results except Assistant, which has no
  // Results pane: its conversation is its result, and it opens on Chat.
  repeated AgentDetailPaneTab panes = 6;
  oneof pane {
    AgentResults results = 7;
    AgentActivity activity = 8;
    AgentChat chat = 9;
    AgentSettings settings = 10;
  }
}

enum AgentDetailPane {
  AGENT_DETAIL_PANE_UNSPECIFIED = 0;
  // Stats and runs.
  AGENT_DETAIL_PANE_ACTIVITY = 1;
  AGENT_DETAIL_PANE_CHAT = 2;
  // What the agent produced.
  AGENT_DETAIL_PANE_RESULTS = 3;
  // What configures the agent.
  AGENT_DETAIL_PANE_SETTINGS = 4;
}

message AgentDetailPaneTab {
  AgentDetailPane pane = 1;
  // "Results", "Activity", "Chat", "Settings"
  string label = 2;
  bool current = 3;
}

// What the agent produced.
message AgentResults {
  oneof state {
    // News Bearer: its briefings, switched with Intent.select_edition as on the Briefing screen.
    BriefingView briefing = 1;
    // Every other agent: groups of items, each with the threads, events, approvals or quarantined
    // mail it is about.
    ResultGroups groups = 2;
    ResultsEmpty empty = 3;
  }
}

message ResultGroups {
  // Counts over the groups: "6" "For you", "4" "Updates"
  repeated Stat stats = 1;
  repeated ResultGroup groups = 2;
}

message ResultGroup {
  // "Recent decisions", "Asks you"
  string title = 1;
  repeated ResultItem items = 2;
}

message ResultItem {
  // Stable within the page: "gatekeeper-0-1"
  string id = 1;
  // "Sorted into For you"
  string title = 2;
  // "From a Laurentian address you answer often"
  string detail = 3;
  // "9:41", "Tue"
  string time = 4;
  repeated Reference references = 5;
}

// Nothing produced yet.
message ResultsEmpty {
  // "Nothing yet. Results appear after its first run"
  string text = 1;
}

message AgentActivity {
  repeated Stat stats = 1;
  // Newest first.
  repeated AgentRun runs = 2;
}

// One run. The Frontend shows the steps when the user expands it.
message AgentRun {
  reserved 2;
  string id = 1;
  RunOutcome outcome = 3;
  // "Drafted 1 · waiting for you"
  string summary = 4;
  // "9 s"
  string duration = 5;
  // In order.
  repeated RunStep steps = 6;
  // When it started: "9:45", "Tue 18:00"
  string start = 7;
  // What started it.
  RunCause cause = 8;
  // "Claude Sonnet"
  string model = 9;
  // "3 steps"
  string step_count = 10;
  // "4,210 tokens"
  string tokens = 11;
  // The run shown with its steps (DisclosureTarget.run_id).
  Disclosure detail = 12;
}

message RunCause {
  // "New mail: Next steps: ML infrastructure interview loop", "Scheduled: Weekdays at 9:00",
  // "Your message: “When and where is my COSC 4456 exam?”"
  string text = 1;
  // The mail that started it; none for a schedule or a message.
  repeated Reference references = 2;
}

message RunOutcome {
  oneof state {
    RunDone done = 1;
    RunWaiting waiting = 2;
    RunRunning running = 3;
    RunFailed failed = 4;
    RunStopped stopped = 5;
    RunPaused paused = 6;
  }
}

message RunDone {}

// It left something waiting for the user.
message RunWaiting {}

// Still going.
message RunRunning {}

message RunFailed {
  // "Anthropic did not answer in time. Nothing was changed"
  string reason = 1;
}

// Agents are paused: it finished its current step and goes on when they are resumed.
message RunPaused {}

// It reached a safety cap or the token budget.
message RunStopped {
  // "Stopped at the limit on mails one turn may read"
  string text = 1;
}

message RunStep {
  // Stable within the run: "r-12-0"
  string id = 6;
  // "Drafted"
  string verb = 1;
  // "Reply to Northline Talent"
  string what = 2;
  StepPermission permission = 3;
  // "Ran on Auto", "Asked you", "Off: not done"; empty for a read.
  string permission_label = 4;
  // The threads, events, approvals or quarantined mail it read or touched.
  repeated Reference references = 5;
}

// How the agent's permissions applied to a step.
enum StepPermission {
  STEP_PERMISSION_UNSPECIFIED = 0;
  // A read or a search: no permission applies.
  STEP_PERMISSION_READ = 1;
  // An action that ran on Auto.
  STEP_PERMISSION_AUTO = 2;
  // An action that resolved to Ask: it waits in the approval queue.
  STEP_PERMISSION_ASKED = 3;
  // An action that is Off: not done.
  STEP_PERMISSION_OFF = 4;
}

// What configures the agent. Its intents: set_agent_active, set_agent_instructions, add_agent_time,
// remove_agent_time, set_agent_model, set_agent_permission, set_agent_account, add_news_topic,
// remove_news_topic and remove_agent.
message AgentSettings {
  oneof instructions {
    SystemInstructions system = 1;
    UserInstructions user = 2;
  }
  oneof schedule {
    EventSchedule on_event = 3;
    TimesSchedule at_times = 4;
    MessageSchedule on_message = 5;
    IntervalSchedule every = 20;
  }
  Model model = 6;
  repeated Permission permissions = 7;
  // Every connected account, marked where the agent can see it.
  repeated AgentAccount accounts = 8;
  oneof news {
    NewsTopicSettings topics = 9;
    // Every agent but News Bearer.
    NoNewsTopics none = 10;
  }
  reserved 11;
  reserved "active";
  // What it does without a model key: "Off until you add a model key"
  string key_note = 12;
  oneof removal {
    // The agents the user made.
    DeleteAgent delete = 13;
    // System agents are deactivated with the switch, never deleted.
    DeactivateOnly deactivate_only = 14;
  }
  // The model menu (Intent.set_agent_model).
  repeated ModelChoice models = 15;
  // The times Intent.add_agent_time offers.
  repeated TimeChoice time_choices = 16;
  // What wakes it besides its schedule, in the builder's order; none for Assistant and for
  // Gatekeeper and Security Guard, which every new mail reaches in a fixed order.
  repeated AgentTrigger triggers = 17;
  // When its schedule wakes it next.
  oneof next_run {
    NextRun next = 18;
    NoNextRun unscheduled = 19;
  }
}

message AgentTrigger {
  // "Mail sorted into a category or folder"
  string label = 1;
  // "Into Receipts, from anyone, all accounts"
  string filters = 2;
}

message NextRun {
  // "Next run 10:45", "Next run Thu 9:00", "Due now"
  string text = 1;
}

// It has no schedule: only its triggers or a message wake it.
message NoNextRun {}

// Built in: shown read-only, followed by the user's own.
message SystemInstructions {
  string built_in = 1;
  // Appended after the built-in ones; may be empty.
  string yours = 2;
  // "Your instructions for Gatekeeper"
  string yours_label = 3;
}

message UserInstructions {
  string text = 1;
}

// It wakes on something happening: its triggers, or the Backend's order on new mail.
message EventSchedule {
  // "On every new mail, after your rules", "Mail sorted into a category or folder"
  string when = 1;
}

// It wakes every so often, besides its triggers.
message IntervalSchedule {
  // "Mail sorted into a category or folder, every hour"
  string when = 1;
}

// It has no trigger and no schedule to edit: it wakes only when the user writes to it (Assistant).
message MessageSchedule {
  // "Only when you write to it"
  string when = 1;
}

// It runs at set times, which the user can add to.
message TimesSchedule {
  reserved 2;
  reserved "times";
  // "Daily at"
  string when = 1;
  // Its times in order; Intent.remove_agent_time takes the minute.
  repeated TimeChoice set_times = 3;
}

message AgentAccount {
  string id = 1;
  string name = 2;
  MailProvider provider = 3;
  bool included = 4;
}

// News Bearer's topics.
message NewsTopicSettings {
  // "Distributed systems"
  repeated string topics = 1;
  // "3 of 10 topics"
  string cap = 2;
  // Changes when a topic was added: the Frontend empties its field.
  uint32 revision = 3;
}

message NoNewsTopics {}

message DeleteAgent {
  // "Delete agent"
  string label = 1;
}

message DeactivateOnly {
  // "Built-in agents can be turned off, not deleted"
  string text = 1;
}

// The conversation of an agent that can chat.
message AgentChat {
  reserved 1;
  oneof availability {
    ChatReady ready = 2;
    ChatBusy busy = 3;
    ChatOff off = 4;
    ChatDeactivated deactivated = 5;
  }
  oneof conversation {
    ChatTurns turns = 6;
    ChatEmpty empty = 7;
  }
  // Changes when a message was sent: the Frontend empties its box.
  uint32 revision = 8;
}

// The composer takes a message (Intent.send_chat_message).
message ChatReady {
  // "Message Receipts clerk"
  string placeholder = 1;
}

// A turn is running: one running turn at a time. A turn waiting for an approval does not hold the
// conversation.
message ChatBusy {
  // "Day summary is answering"
  string text = 1;
}

// No key for the agent's model: chat is off. The action opens the Models settings section
// (Intent.open_settings with SETTINGS_SECTION_MODELS).
message ChatOff {
  // "Chat is off until you add an OpenAI key"
  string text = 1;
  // "Add a key"
  string action = 2;
}

// The agent is deactivated; its active switch turns it back on.
message ChatDeactivated {
  // "Receipts clerk is off. Turn it on to chat"
  string text = 1;
}

// Oldest first.
message ChatTurns {
  repeated ChatTurn turns = 1;
}

message ChatEmpty {
  // "Ask Receipts clerk about its work, or give it a one-off task"
  string hint = 1;
}

// One message from the user and what became of it.
message ChatTurn {
  string id = 1;
  // "When and where is my COSC 4456 exam?"
  string message = 2;
  // "8:20", "Mon"
  string time = 3;
  oneof state {
    TurnRunning running = 4;
    TurnWaiting waiting = 5;
    TurnAnswered answered = 6;
    TurnFailed failed = 7;
    TurnStopped stopped = 8;
  }
}

message TurnRunning {
  // "Reading your mail"
  string label = 1;
}

// An action resolved to Ask: the turn is parked until the approval is answered. The item is on the
// Approvals screen (Intent.open_approvals).
message TurnWaiting {
  // The ApprovalItem's id and title: "a-assistant-mira", "Reply to Mira"
  string approval_id = 1;
  string approval_title = 2;
  // "Waiting for your approval"
  string label = 3;
}

message TurnAnswered {
  repeated string paragraphs = 1;
  // The threads and events the answer is about.
  repeated Reference references = 2;
}

message TurnFailed {
  // "Anthropic did not answer in time. Nothing was changed"
  string reason = 1;
}

// It reached a safety cap or the token budget.
message TurnStopped {
  // "Stopped at the limit on mails one turn may read. Ask about a shorter span"
  string text = 1;
}
