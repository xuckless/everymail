syntax = "proto3";

package ui.v1;

import "ui/v1/common.proto";

// Every calendar in one view: a week, a month or a year around the selected day. The path is
// "/u/0/calendar/<week|month|year>/<selected day>", such as "/u/0/calendar/week/2026-11-11".
// Previous, next and today are Intent.show_previous_period, show_next_period and show_today.
message CalendarView {
  reserved 1, 2, 3, 4;
  // "November 2026", "2026"
  string title = 10;
  // Week, Month, Year; one current (Intent.select_calendar_view).
  repeated CalendarModeTab modes = 11;
  oneof period {
    WeekPeriod week = 12;
    MonthPeriod month = 13;
    YearPeriod year = 14;
  }
  repeated CalendarSource calendars = 5;
  // Invitations waiting for or holding an answer.
  repeated Invitation invitations = 6;
  // The selected event (Intent.select_event, closed with Intent.close_event).
  oneof selected {
    NoEventSelected none = 7;
    EventDetail event = 8;
    SelectedInvitation invitation = 15;
    // A new event not saved yet (Intent.new_event); its id is empty.
    EventDetail unsaved = 16;
  }
  reserved 9;
}

message SelectedInvitation {
  Invitation invitation = 1;
  // The day it is on: "2026-11-12"
  string day_id = 2;
}

enum CalendarMode {
  CALENDAR_MODE_UNSPECIFIED = 0;
  CALENDAR_MODE_WEEK = 1;
  CALENDAR_MODE_MONTH = 2;
  CALENDAR_MODE_YEAR = 3;
}

message CalendarModeTab {
  CalendarMode mode = 1;
  // "Week"
  string label = 2;
  bool current = 3;
}

// Monday to Sunday. The phone shows the selected day's agenda.
message WeekPeriod {
  // "Nov 9 – 15", "Nov 30 – Dec 6"
  string range = 1;
  // The hours the grid shows, top to bottom.
  repeated HourMark hours = 2;
  repeated CalendarDay days = 3;
}

// The weeks that hold the month, Monday first. Selecting a day (Intent.select_day) opens its week.
message MonthPeriod {
  // "Mon" to "Sun"
  repeated string weekdays = 1;
  repeated MonthWeek weeks = 2;
}

message MonthWeek {
  repeated MonthDay days = 1;
}

message MonthDay {
  // The date: "2026-11-11"
  string id = 1;
  // "11"
  string day = 2;
  // False for the days before and after the month that fill its first and last week.
  bool in_month = 3;
  bool today = 4;
  bool selected = 5;
  // At most three; when more events fall on the day, two and `more`.
  repeated EventChip chips = 6;
  // "+2 more"; empty when every event has a chip.
  string more = 7;
}

message EventChip {
  string id = 1;
  string title = 2;
  CalendarColor color = 3;
  // "10:00"
  string start = 4;
}

// Twelve months. Selecting a month (Intent.select_month) opens it.
message YearPeriod {
  // "M" to "S"
  repeated string weekdays = 1;
  repeated YearMonth months = 2;
}

message YearMonth {
  // "2026-11"
  string id = 1;
  // "November"
  string name = 2;
  // It holds the selected day.
  bool current = 3;
  repeated YearWeek weeks = 4;
}

message YearWeek {
  repeated YearDay days = 1;
}

message YearDay {
  // "2026-11-11"
  string id = 1;
  // "11"
  string day = 2;
  // False for the days of the neighbouring months that fill a week; the Frontend leaves them blank.
  bool in_month = 3;
  bool today = 4;
  // Some event falls on it.
  bool busy = 5;
}

message HourMark {
  // Minutes after midnight.
  uint32 minute = 1;
  // "8:00"
  string label = 2;
}

message CalendarDay {
  reserved 4;
  // "Mon"
  string weekday = 1;
  // "9"
  string day = 2;
  bool today = 3;
  // The phone agenda's title: "Today, Wed Nov 11", "Thu Nov 12"
  string title = 7;
  // Only events of calendars that are shown.
  oneof agenda {
    DayEvents events = 8;
    NothingPlanned nothing = 9;
  }
  // The date: "2026-11-11"
  string id = 5;
  // The selected day (Intent.select_day), the one a narrow layout shows; today until the user picks
  // another.
  bool selected = 6;
}

message DayEvents {
  repeated CalendarEvent events = 1;
}

// A day without events.
message NothingPlanned {
  // "Nothing planned"
  string text = 1;
}

// The colour a calendar is shown in, the same on the calendar and on each of its events.
enum CalendarColor {
  CALENDAR_COLOR_UNSPECIFIED = 0;
  CALENDAR_COLOR_VIOLET = 1;
  CALENDAR_COLOR_CYAN = 2;
  CALENDAR_COLOR_AMBER = 3;
}

message CalendarEvent {
  reserved 2;
  string id = 1;
  // Its calendar's colour.
  CalendarColor color = 10;
  string title = 3;
  // "10:00 · FA-110", "Invitation · reply"
  string detail = 4;
  // Minutes after midnight.
  uint32 start_minute = 5;
  uint32 end_minute = 6;
  bool selected = 7;
  oneof kind {
    PlainEvent plain = 8;
    InvitationAnswer invitation = 9;
  }
  // The phone agenda's time column: "10:00"
  string start = 11;
  // The phone agenda's line: "10:00–11:30 · FA-110 · Laurentian", "Mira invited you · tap to reply"
  string agenda_line = 12;
}

message PlainEvent {}

message CalendarSource {
  string id = 1;
  string name = 2;
  CalendarProvider provider = 3;
  // "iCloud through CalDAV"
  string provider_name = 4;
  bool shown = 5;
  CalendarColor color = 6;
}

message NoEventSelected {}

// The event drawer, with the event's current values.
message EventDetail {
  reserved 6, 8;
  // Empty for the unsaved event.
  string id = 1;
  // The drawer's title: "Edit event", "New event"
  string heading = 9;
  string title = 2;
  // The days of the event's week: "Mon, Nov 9".
  repeated Choice days = 3;
  // "10:00"
  string starts = 4;
  string ends = 5;
  repeated CalendarChoice calendars = 11;
  // "Saved to Outlook calendar"
  string saved_to = 7;
  // "Mira"
  repeated string guests = 10;
  // The values Intent.save_event takes.
  string day_id = 12;
  uint32 start_minute = 13;
  uint32 end_minute = 14;
  // Every half hour, for the start and end menus.
  repeated TimeChoice times = 15;
  // "FA-224", or empty; Intent.save_event takes it back.
  string place = 16;
}

// One calendar the event can be saved to.
message CalendarChoice {
  string id = 1;
  string name = 2;
  CalendarColor color = 3;
  bool selected = 4;
}

// One day the event can be on.
message Choice {
  string id = 1;
  string label = 2;
  bool selected = 3;
}
